server:
  port: 8081

spring:
  r2dbc:
    # URL sin puerto duplicado; el driver agrega por defecto 5432 si no se especifica
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://db_autenticacion/crediyaseguridad}
    username: ${SPRING_R2DBC_USERNAME:crediya}
    password: ${SPRING_R2DBC_PASSWORD:crediya2025}
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null

cors:
  allowed-origins: http://localhost:4200,http://autenticacion:8081,http://solicitudes:8082

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    co.com.pragma: INFO
    org.springframework.r2dbc: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
    io.r2dbc.postgresql.PARAM: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

application:
  name: "Pragma User Management API (Docker)"
  description: "API REST para administración de usuarios con arquitectura reactiva usando Spring WebFlux y R2DBC con PostgreSQL. - Banco Colombia CrediYa (Containerized)"
  version: "1.0.0"
